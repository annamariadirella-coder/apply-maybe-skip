name: JobOps checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run test:collector
      - run: python -m pip install -r services/matcher/requirements.txt
      - run: npm run test:matcher
